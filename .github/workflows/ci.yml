name: ci

on:
  push:
    paths:
      - "**.cpp"
      - "**.hpp"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci.yml"
  pull_request:


jobs:

  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - &checkout
      uses: actions/checkout@v6

    - run: cmake --workflow debug
    - run: cmake --workflow release
